[workspace]
members = [
  "crates/server",
  "crates/team-onboarding",
  "crates/batch-sim",
  "crates/internal-tracing",
  "crates/walnut-shared",
  "crates/data-decoder",
]
resolver = "2"

[workspace.package]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]

internal-tracing = { path = "./crates/internal-tracing" }
walnut-shared = { path = "./crates/walnut-shared" }
verification = { path = "./crates/verification" }
data-decoder = { path = "./crates/data-decoder" }
simulate = { path = "./crates/simulate" }

axum = { version = "0.6.20", features = ["macros"] }
sqlx = { version = "0.7.2", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "time",
] }
tower = { version = "0.4.13", features = ["timeout"] }
tower-http = { version = "0.4.4", features = ["cors", "trace"] }
tokio = { version = "1.33.0", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.5.0"
num-bigint = { version = "0.4.4", features = ["rand"] }
camino = { version = "1.1.4", features = ["serde1"] }
fs2 = "0.4.3"
flate2 = "1.0.27"
anyhow = "1.0.75"
num-traits = "0.2.18"
ctor = "0.2.4"
indoc = "2"
starknet-crypto = "0.6.2"
dotenv = "0.15.0"
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.11.22", features = ["json", "stream"] }
utoipa = "4.2.3"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = [
  "std",
  "registry",
  "env-filter",
  "json",
] }
cookie = { version = "0.18", features = ["percent-encode"] }
jsonwebtoken = "9.2.0"
urlencoding = "2.1.3"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }
time = { version = "0.3.36", features = ["serde"] }
futures = { version = "0.3.30", features = ["async-await"] }
itertools = "0.12.1"
toml = "0.8.14"
aws-sdk-s3 = { version = "1.38.0", features = ["rt-tokio"] }
aws-config = { version = "1.5.3", features = ["behavior-version-latest"] }
aws-smithy-types = "1.2.0"
hex = "0.4.3"
indexmap = "2.3.0"
walkdir = "2.5.0"
smol_str = { version = "0.3.0", features = ["serde"] }
thiserror = "1.0.60"
num-integer = "0.1.46"
lazy_static = "1.5.0"
sentry = "0.34.0"
sentry-tracing = "0.34.0"
sentry-tower = { version = "0.34.0", features = [
  "http",
  "axum",
  "axum-matched-path",
] }
fs_extra = "1.3.0"
ethers = "2.0.14" 
tiny-keccak = "2.0.2"

#starknet
starknet = "0.17.0"
starknet_api = { git = "https://github.com/software-mansion-labs/sequencer.git", branch = "main-v0.14.0" } #depend on foundry
starknet-types-core = { version = "0.2.0", features = [
  "hash",
  "prime-bigint",
  "serde",
] }
starknet-selector-decoder = { git = "https://github.com/amanusk/starknet-selector-decoder", branch = "main" }

blockifier = { git = "https://github.com/software-mansion-labs/sequencer.git", branch = "main-v0.14.0", default-features = false, features = [
  "testing",
  "tracing",
] } # depend on foundry
cairo-annotations = { version = "0.6.1", features = ["cairo-lang"] }
cairo-vm = "2.5.0"

# Cairo compiler
cairo-lang-casm = "2.12.3"
cairo-lang-runner = "2.12.3"
cairo-lang-utils = "2.12.3"
cairo-lang-starknet = "2.12.3"
cairo-lang-sierra = "2.12.3"
cairo-lang-sierra-type-size = "2.12.3"
cairo-lang-starknet-classes = "2.12.3"
cairo-lang-sierra-to-casm = "2.12.3"

# Starknet Foundry 
cheatnet = { git = "https://github.com/walnuthq/starknet-foundry", rev = "1e3d8762bc09fa7d50a48d38000cc73bf942f63b" }
runtime = { git = "https://github.com/walnuthq/starknet-foundry", rev = "1e3d8762bc09fa7d50a48d38000cc73bf942f63b" }
scarb-api = { git = "https://github.com/walnuthq/starknet-foundry", rev = "1e3d8762bc09fa7d50a48d38000cc73bf942f63b" }
conversions = { git = "https://github.com/walnuthq/starknet-foundry", rev = "1e3d8762bc09fa7d50a48d38000cc73bf942f63b" }
universal-sierra-compiler-api = { git = "https://github.com/walnuthq/starknet-foundry", rev = "1e3d8762bc09fa7d50a48d38000cc73bf942f63b" }

# For Scarb binary download scheduler
tokio-util = { version = "0.7.11", features = ["compat"] }
regex = "1.11.1"
async-tar = "0.5.0"
semver = "1.0"
async-compression = { version = "0.4.1", features = ["gzip", "tokio"] }
clokwerk = "0.4.0"
lazy-regex = "3.3.0"
