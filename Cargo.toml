[workspace]
members = [
  "crates/server",
  "crates/team-onboarding",
  "crates/batch-sim",
  "crates/internal-tracing",
  "crates/walnut-shared",
  "crates/calldata-decoder",
]
resolver = "2"

[workspace.package]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axum = "0.6.20"
redis = { version = "0.23.3", features = ["tokio-comp"] }
sqlx = { version = "0.7.2", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "time",
] }
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["cors", "trace"] }
tokio = { version = "1.33.0", features = ["full"] }
conversions = { path = "./crates/conversions" }
starknet = "0.10.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.5.0"
starknet_api = "=0.12.0-dev.1"
num-bigint = { version = "0.4.4", features = ["rand"] }
camino = { version = "1.1.4", features = ["serde1"] }
fs2 = "0.4.3"
flate2 = "1.0.27"
regex = "1.9.6"
anyhow = "1.0.75"
cairo-felt = "0.9.1"
cairo-vm = "0.9.2"
thiserror = "1.0.49"
num-traits = "0.2.18"
ctor = "0.2.4"
indoc = "2"
starknet-crypto = "0.6.2"
dotenv = "0.15.0"
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.11.22", features = ["json"] }
starknet-providers = "0.10.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = [
  "std",
  "registry",
  "env-filter",
  "json",
] }
cookie = { version = "0.18", features = ["percent-encode"] }
jsonwebtoken = "9.2.0"
urlencoding = "2.1.3"
deadpool-redis = "0.13.0"
uuid = "1.6.1"
time = "0.3.31"
futures = { version = "0.3.30", features = ["async-await"] }
cheatnet = { path = "../walnut-starknet-foundry/crates/cheatnet" }
runtime = { path = "../walnut-starknet-foundry/crates/runtime" }
scarb-api = { path = "../walnut-starknet-foundry/crates/scarb-api" }
itertools = "0.12.1"
internal-tracing = { path = "./crates/internal-tracing" }
walnut-shared = { path = "./crates/walnut-shared" }
calldata-decoder = { path = "./crates/calldata-decoder" }
# cairo-lang-casm = "2.6.3"
cairo-lang-casm = { git = "https://github.com/walnuthq/cairo", rev = "e27ee4aa794331cabee4a22768fe99d837b489df", features = [
  "serde",
] }
cairo-lang-runner = "2.6.3"
# cairo-lang-utils = "2.6.3"
cairo-lang-utils = { git = "https://github.com/walnuthq/cairo", rev = "e27ee4aa794331cabee4a22768fe99d837b489df" }
cairo-lang-starknet = "2.6.3"
# cairo-lang-sierra = "2.6.3"
cairo-lang-sierra = { git = "https://github.com/walnuthq/cairo", rev = "e27ee4aa794331cabee4a22768fe99d837b489df" }
# cairo-lang-starknet-classes = "2.6.3"
cairo-lang-starknet-classes = { git = "https://github.com/walnuthq/cairo", rev = "e27ee4aa794331cabee4a22768fe99d837b489df" }
# cairo-lang-sierra-to-casm = "2.6.3"
cairo-lang-sierra-to-casm = { git = "https://github.com/walnuthq/cairo", rev = "e27ee4aa794331cabee4a22768fe99d837b489df" }
# blockifier = { path = "../walnut-blockifier/crates/blockifier" }
blockifier = { git = "https://github.com/walnuthq/blockifier", rev = "8401ca0a1e0afc0e54fc6077bb9b90788923a0e3" }
