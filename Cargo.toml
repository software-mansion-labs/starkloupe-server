[workspace]
members = ["crates/server", "crates/team-onboarding", "crates/batch-sim"]
resolver = "2"

[workspace.package]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axum = "0.6.20"
redis = { version = "0.23.3", features = ["tokio-comp"] }
sqlx = { version = "0.7.2", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "time",
] }
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["cors", "trace"] }
tokio = { version = "1.33.0", features = ["full"] }
# blockifier = { git = "https://github.com/walnuthq/blockifier" }
blockifier = { path = "../walnut-blockifier/crates/blockifier" }
conversions = { path = "./crates/conversions" }
starknet = "0.10.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.5.0"
starknet_api = "=0.12.0-dev.1"
num-bigint = { version = "0.4.4", features = ["rand"] }

# DEFAULT CAIRO 
# cairo-lang-casm = "2.6.3"
cairo-lang-runner = "2.6.3"
# cairo-lang-utils = "2.6.3"
cairo-lang-starknet = "2.6.3"
# cairo-lang-sierra = "2.6.3"
# cairo-lang-starknet-classes = "2.6.3"
# cairo-lang-sierra-to-casm = "2.6.3"


# WALNUT CAIRO
cairo-lang-casm = { path = "../walnut-cairo/crates/cairo-lang-casm" }
cairo-lang-starknet-classes = { path = "../walnut-cairo/crates/cairo-lang-starknet-classes" }
cairo-lang-sierra-to-casm = { path = "../walnut-cairo/crates/cairo-lang-sierra-to-casm" }
cairo-lang-sierra = { path = "../walnut-cairo/crates/cairo-lang-sierra" }
cairo-lang-utils = { path = "../walnut-cairo/crates/cairo-lang-utils" }


camino = { version = "1.1.4", features = ["serde1"] }
fs2 = "0.4.3"
flate2 = "1.0.27"
regex = "1.9.6"
anyhow = "1.0.75"
cairo-felt = "0.9.1"
cairo-vm = "0.9.2"
thiserror = "1.0.49"
num-traits = "0.2.18"
ctor = "0.2.4"
indoc = "2"
starknet-crypto = "0.6.2"
dotenv = "0.15.0"
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.11.22", features = ["json"] }
starknet-providers = "0.10.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = [
    "std",
    "registry",
    "env-filter",
    "json",
] }
cookie = { version = "0.18", features = ["percent-encode"] }
jsonwebtoken = "9.2.0"
urlencoding = "2.1.3"
deadpool-redis = "0.13.0"
uuid = "1.6.1"
time = "0.3.31"
futures = { version = "0.3.30", features = ["async-await"] }
# cheatnet = { git = "https://github.com/foundry-rs/starknet-foundry.git", branch = "master", package = "cheatnet" }
cheatnet = { path = "../walnut-starknet-foundry/crates/cheatnet" }
runtime = { path = "../walnut-starknet-foundry/crates/runtime" }
walnut-foundry-utils = { path = "../walnut-starknet-foundry/crates/walnut-foundry-utils" }
# sncast = { path = "../walnut-starknet-foundry/crates/sncast" }
scarb-api = { path = "../walnut-starknet-foundry/crates/scarb-api" }
itertools = "0.12.1"
