[workspace]
members = [
  "crates/server",
  "crates/team-onboarding",
  "crates/batch-sim",
  "crates/internal-tracing",
  "crates/walnut-shared",
  "crates/calldata-decoder",
]
resolver = "2"

[workspace.package]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axum = { version = "0.6.20", features = ["macros"] }
redis = { version = "0.23.3", features = ["tokio-comp"] }
sqlx = { version = "0.7.2", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "time",
] }
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["cors", "trace"] }
tokio = { version = "1.33.0", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.5.0"
starknet_api = "0.13.0-dev.7"
num-bigint = { version = "0.4.4", features = ["rand"] }
camino = { version = "1.1.4", features = ["serde1"] }
fs2 = "0.4.3"
flate2 = "1.0.27"
regex = "1.9.6"
anyhow = "1.0.75"
cairo-vm = "1.0.1"
num-traits = "0.2.18"
ctor = "0.2.4"
indoc = "2"
starknet-crypto = "0.6.2"
dotenv = "0.15.0"
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.11.22", features = ["json"] }
starknet-providers = "0.10.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = [
  "std",
  "registry",
  "env-filter",
  "json",
] }
cookie = { version = "0.18", features = ["percent-encode"] }
jsonwebtoken = "9.2.0"
urlencoding = "2.1.3"
deadpool-redis = "0.13.0"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }
time = "0.3.36"
futures = { version = "0.3.30", features = ["async-await"] }
itertools = "0.12.1"
internal-tracing = { path = "./crates/internal-tracing" }
walnut-shared = { path = "./crates/walnut-shared" }
verification = { path = "./crates/verification" }
calldata-decoder = { path = "./crates/calldata-decoder" }
simulate = { path = "./crates/simulate" }
blockifier = "0.8.0-rc.3"
starknet-selector-decoder = { git = "https://github.com/amanusk/starknet-selector-decoder", branch = "main" }
toml = "0.8.14"
aws-sdk-s3 = { version = "1.38.0", features = ["rt-tokio"] }
aws-config = { version = "1.5.3", features = ["behavior-version-latest"] }
aws-smithy-types = "1.2.0"
hex = "0.4.3"
indexmap = "2.3.0"
walkdir = "2.5.0"
smol_str = { version = "0.2.0", features = ["serde"] }
thiserror = "1.0.60"
num-integer = "0.1.46"
starknet-types-core = { version = "0.1.6", features = [
  "hash",
  "prime-bigint",
  "serde",
] }
starknet-old = { package = "starknet", version = "0.10.0" }
starknet = { git = "https://github.com/xJonathanLEI/starknet-rs", rev = "db1fa598232f0698d942cc974f481b5d888ac080" }

# Cairo compiler
cairo-lang-casm = "2.8.2"
cairo-lang-runner = "2.8.2"
cairo-lang-utils = "2.8.2"
cairo-lang-starknet = "2.8.2"
cairo-lang-sierra = "2.8.2"
cairo-lang-sierra-type-size = "2.8.2"
cairo-lang-starknet-classes = "2.8.2"
cairo-lang-sierra-to-casm = "2.8.2"

# Starknet Foundry
cheatnet = { git = "https://github.com/walnuthq/starknet-foundry", rev = "9d704614a69812e8b4fae5507306e2bfdb03243e" }
runtime = { git = "https://github.com/walnuthq/starknet-foundry", rev = "9d704614a69812e8b4fae5507306e2bfdb03243e" }
scarb-api = { git = "https://github.com/walnuthq/starknet-foundry", rev = "9d704614a69812e8b4fae5507306e2bfdb03243e" }
conversions = { git = "https://github.com/walnuthq/starknet-foundry", rev = "9d704614a69812e8b4fae5507306e2bfdb03243e" }
universal-sierra-compiler-api = { git = "https://github.com/walnuthq/starknet-foundry", rev = "9d704614a69812e8b4fae5507306e2bfdb03243e" }
