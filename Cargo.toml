[workspace]
members = [
    "crates/conversions",
    "crates/forking",
    "crates/server",
]
resolver = "2"

[workspace.package]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axum = "0.6.20"
redis = { version = "0.23.3", features = ["tokio-comp"] }
sqlx = { version = "0.7.2", features = ["runtime-tokio", "tls-native-tls", "postgres"] }
tower = "0.4.13"
tower-http = "0.4.4"
tokio = { version = "1.33.0", features = ["full"] }
blockifier = { git = "https://github.com/jainkunal/blockifier", rev="d895ae1788b9484de34e68d7d7cfbad2aa3bbd92" }
conversions = { path = "./crates/conversions" }
starknet = "0.5.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.4.0"
starknet_api = "0.5.0-rc1"
num-bigint = { version = "0.4.4", features = ["rand"] }
cairo-lang-casm = "2.2.0"
cairo-lang-runner = "2.2.0"
cairo-lang-utils = "2.2.0"
cairo-lang-starknet = "2.2.0"
camino = { version = "1.1.4", features = ["serde1"] }
fs2 = "0.4.3"
flate2 = "1.0.27"
regex = "1.9.6"
anyhow = "1.0.75"
cairo-felt = "0.8.2"
cairo-vm = "0.8.2"
thiserror = "1.0.49"
num-traits = "0.2.16"
ctor = "0.2.4"
indoc = "2"
starknet-crypto = "0.5.1"