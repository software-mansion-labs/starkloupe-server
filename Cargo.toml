[workspace]
members = [
    "crates/conversions",
    "crates/forking",
    "crates/server",
    "crates/team-onboarding",
    "crates/batch-sim",
    "crates/starknet-abi",
]
resolver = "2"

[workspace.package]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axum = "0.6.20"
redis = { version = "0.23.3", features = ["tokio-comp"] }
sqlx = { version = "0.7.2", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "time"] }
tower = "0.4.13"
tower-http = {version="0.4.4", features = ["cors", "trace"]}
tokio = { version = "1.33.0", features = ["full"] }
blockifier = { git = "https://github.com/jainkunal/blockifier", rev="8770a73c1ff8d6baf831f56c431165471aab3d5c" }
conversions = { path = "./crates/conversions" }
starknet = "0.7.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.4.0"
starknet_api = "0.5.0-rc1"
num-bigint = { version = "0.4.4", features = ["rand"] }
cairo-lang-casm = "2.2.0"
cairo-lang-runner = "2.2.0"
cairo-lang-utils = "2.2.0"
cairo-lang-starknet = "2.2.0"
camino = { version = "1.1.4", features = ["serde1"] }
fs2 = "0.4.3"
flate2 = "1.0.27"
regex = "1.9.6"
anyhow = "1.0.75"
cairo-felt = "0.8.2"
cairo-vm = "0.8.2"
thiserror = "1.0.49"
num-traits = "0.2.16"
ctor = "0.2.4"
indoc = "2"
starknet-crypto = "0.5.1"
dotenv = "0.15.0"
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.11.22", features = ["json"] }
starknet-providers = "0.7.0"
tracing = "0.1.40"
tracing-subscriber = {version="0.3.17", features = ["std", "registry", "env-filter", "json"]}
starknet-abi = { path = "./crates/starknet-abi" }
cookie = { version = "0.18", features = ["percent-encode"] }
jsonwebtoken = "9.2.0"
urlencoding = "2.1.3"
deadpool-redis = "0.13.0"
uuid = "1.6.1"
time = "0.3.31"