# Backing services for the end-to-end simulation test.
#
# Ports deliberately avoid the defaults: 1234 matches db-docker-compose.yaml, and
# MinIO sits on 9010/9011 because 9000 is a common collision with other projects.
name: walnut-e2e

services:
  postgres:
    image: postgres:17.0-alpine
    container_name: walnut_e2e_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=walnut
    ports:
      - 1234:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Stands in for the S3-compatible storage the server expects at startup. The
  # buckets only need to exist — the simulation path never reads from them, and
  # an empty binaries bucket is a warning, not an error.
  minio:
    image: quay.io/minio/minio
    container_name: walnut_e2e_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DOMAIN=localhost
    ports:
      - 9010:9000
      - 9011:9001
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/walnut-classes local/walnut-binaries &&
      echo 'buckets ready'
      "
