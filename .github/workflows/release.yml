name: Release

# Builds the image and pushes it to Artifact Registry. It does NOT deploy.
#
# Runs only for a `v*` tag on a commit that is on main; any other tag fails
# before building. The release then asks starkloupe-infra to promote the
# image: a repository_dispatch there records its digest in a pull request
# against releases/starkloupe-server.json. Merging that and running
# starkloupe-infra's Terraform Apply workflow is what deploys it.

on:
  push:
    tags: ["v[0-9]+.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the Workload Identity token
  attestations: write # sign the image's build provenance

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/software-mansion-dev/walnut/starknet-debugger-server

jobs:
  release:
    name: build and push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
    steps:
      # Every image this workflow pushes is dispatched to starkloupe-infra for
      # promotion, so it only builds a tag on a commit that has landed on main.
      # Compared on GitHub rather than with git, so the checkout stays shallow:
      # `main...<sha>` is "identical" or "behind" exactly when <sha> is in main.
      - name: Require the tag to be on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          if [ "${status}" != identical ] && [ "${status}" != behind ]; then
            echo "Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main (${status})."
            exit 1
          fi

      - uses: actions/checkout@v4

      # No service account key: the provider is locked to this repository in
      # starkloupe-infra/iam.tf. Both variables come from `terraform output`.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # Named after the release tag. git-<sha> is the tag starkloupe-infra's
      # promotion cross-checks against the digest it is sent.
      - name: Resolve image tags
        id: tags
        run: |
          {
            echo "image=${IMAGE}:${GITHUB_REF_NAME}"
            echo "list<<EOF"
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:git-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Rerunning the workflow at a commit that already has an image would
      # rebuild it, and builds are not reproducible: git-<sha> could move to a
      # different digest while a promotion of the first one is still open or
      # already merged. So an image already built for this commit is reused, but
      # only if GitHub has signed its provenance from this repository's release
      # workflow, since anyone with registry access can push a git-<sha> tag.
      # Anything else is built as usual.
      - name: Reuse an existing build of this commit
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest="$(
            gcloud artifacts docker images describe "${IMAGE}:git-${GITHUB_SHA}" \
              --format='value(image_summary.digest)' 2>/dev/null || true
          )"
          if [ -z "${digest}" ]; then
            echo "No image for ${GITHUB_SHA} yet; building it."
            exit 0
          fi
          if ! gh attestation verify "oci://${IMAGE}@${digest}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners; then
            echo "The image tagged git-${GITHUB_SHA} has no matching provenance; building it."
            exit 0
          fi
          # A carbon copy: by default a single source is wrapped in a new index,
          # which has a digest of its own that nothing has verified.
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Reusing ${digest}, already built from ${GITHUB_SHA}."

      # SQLX_OFFLINE=true is set in the Dockerfile, so the compile-time-checked
      # queries build against the committed .sqlx directory. If a PR touched SQL
      # without running `cargo sqlx prepare`, this is where it fails.
      - name: Build and push
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # starkloupe-infra will only promote this digest if GitHub has signed
      # provenance for it from this repository's release workflow. A workflow in
      # another repository can push under this image name, but cannot produce
      # that signature.
      - name: Attest build provenance
        if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Pushed image
        env:
          PUSHED_IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${PUSHED_IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A job of its own so a failed dispatch is retried with "Re-run failed jobs"
  # without building the image again: the digest comes from the release job.
  promote:
    name: request promotion in starkloupe-infra
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create starkloupe-infra dispatch token
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: software-mansion
          repositories: starkloupe-infra
          permission-contents: write

      - name: Request promotion in starkloupe-infra
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          if gh api \
            --method POST \
            repos/software-mansion/starkloupe-infra/dispatches \
            --field event_type=starkloupe-server-release \
            --field "client_payload[source_commit]=${GITHUB_SHA}" \
            --field "client_payload[digest]=${DIGEST}"; then
            echo "Requested promotion of ${DIGEST}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Promotion was not requested"
            echo
            echo "The image ${DIGEST} is pushed and attested and will not be rebuilt."
            echo "Re-run failed jobs to retry."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
