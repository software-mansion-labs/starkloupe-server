name: Release

# Builds the image and pushes it to Artifact Registry. It does NOT deploy.
#
# A release (a tag push, or a manual run on main) then asks starkloupe-infra to
# promote the image: a repository_dispatch there records its digest in a pull
# request against releases/starkloupe-server.json. Merging that and running
# starkloupe-infra's Terraform Apply workflow is what deploys it.

on:
  push:
    tags: ["v[0-9]+.*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the Workload Identity token

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/software-mansion-dev/walnut/starknet-debugger-server

jobs:
  release:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No service account key: the provider is locked to this repository in
      # walnut-infra/iam.tf. Both variables come from `terraform output`.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # Tag pushes are named after the release tag. A manual run is named after
      # the commit - a branch name is not a valid Docker tag, and it would be
      # reused by the next build off the same branch. Only a release moves
      # `latest`.
      - name: Resolve image tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="git-$GITHUB_SHA"
          fi
          {
            echo "image=${IMAGE}:${tag}"
            echo "list<<EOF"
            echo "${IMAGE}:${tag}"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "${IMAGE}:latest"
              echo "${IMAGE}:git-${GITHUB_SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # SQLX_OFFLINE=true is set in the Dockerfile, so the compile-time-checked
      # queries build against the committed .sqlx directory. If a PR touched SQL
      # without running `cargo sqlx prepare`, this is where it fails.
      # starkloupe-infra checks the labels and the provenance before
      # it records a digest. Single platform on purpose: it reads the labels
      # with `imagetools inspect`, which returns none for a multi-platform index.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pushed image
        env:
          PUSHED_IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${PUSHED_IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only releases are promoted: a manual run from a branch still builds and
      # pushes, but asks for nothing.
      - name: Create starkloupe-infra dispatch token
        id: infra-token
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: software-mansion
          repositories: starkloupe-infra
          permission-contents: write

      - name: Request promotion in starkloupe-infra
        if: steps.infra-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh api \
            --method POST \
            repos/software-mansion/starkloupe-infra/dispatches \
            --field event_type=starkloupe-server-release \
            --field "client_payload[source_commit]=${GITHUB_SHA}" \
            --field "client_payload[digest]=${DIGEST}"
