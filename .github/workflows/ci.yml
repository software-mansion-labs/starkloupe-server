name: CI

# Runs format, clippy and check on every pull request and on merges to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The .sqlx directory holds prepared queries so sqlx::query! macros compile
  # without a live database.
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same system packages the Dockerfile installs to build the workspace.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      # Channel comes from rust-toolchain.toml; this also caches the build.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets
