name: CI

# Runs format, clippy, check, an end-to-end simulation test, a secret scan and a
# dependency license audit on every pull request and on merges to main.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The .sqlx directory holds prepared queries so sqlx::query! macros compile
  # without a live database.
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + check + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same system packages the Dockerfile installs to build the workspace.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      # Channel comes from rust-toolchain.toml; this also caches the build.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets

      # The e2e test replays real mainnet transactions through the simulation
      # pipeline. This is the only coverage of the full path - fork state over
      # RPC, blockifier/cheatnet execution, trace collection and serialisation -
      # so it guards the blast radius of a starknet-foundry or blockifier bump.
      #
      # It requires the STARKNET_MAINNET_RPC_URL secret, pointing at a provider
      # that serves JSON-RPC spec 0.10 (older specs omit block header commitments
      # that starknet-rust needs). The steps are skipped when the secret is
      # absent so forks are not failed by a credential they cannot have.
      - name: Check for RPC secret
        id: e2e_guard
        if: ${{ vars.E2E_ENABLED != 'false' }}
        env:
          # Via env, not interpolated into the script: a secret containing a
          # quote or $( ... ) would otherwise break or execute.
          RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          if [ -z "$RPC_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STARKNET_MAINNET_RPC_URL is not set - skipping the e2e run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The e2e script does not install this itself - it only checks the binary
      # is present, so the download stays a visible, cacheable CI step.
      - name: Install Universal Sierra Compiler
        if: steps.e2e_guard.outputs.run == 'true'
        run: sh scripts/install-usc.sh

      # Built here rather than inside the e2e script, so a compile failure is
      # reported as a compile failure and the run does not hold the Postgres and
      # MinIO containers open for the length of a cold build.
      - name: Build server
        if: steps.e2e_guard.outputs.run == 'true'
        run: cargo build --bin server

      - name: Start Postgres and MinIO
        if: steps.e2e_guard.outputs.run == 'true'
        run: |
          docker compose -f local/e2e-docker-compose.yaml up -d --wait postgres minio
          docker compose -f local/e2e-docker-compose.yaml run --rm createbuckets

      - name: Run e2e simulation test
        if: steps.e2e_guard.outputs.run == 'true'
        env:
          E2E_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          E2E_ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
        run: ./scripts/e2e_test.py

      - name: Dump service logs on failure
        if: failure() && steps.e2e_guard.outputs.run == 'true'
        run: docker compose -f local/e2e-docker-compose.yaml logs --tail=100

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the checked-out tree, not the commit history. History is scanned
      # separately when we rotate keys; here we only need to stop a new secret
      # from being added.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Fails if a dependency carries a license we can't ship under Apache-2.0.
      # The allow list lives in deny.toml.
      - name: Check licenses
        run: cargo deny check licenses
