name: Bump starknet-foundry

# Weekly canary for the starknet-foundry dependency.
#
# Repoints the git deps in Cargo.toml at the tip of upstream starknet-foundry,
# then compiles the workspace and replays the e2e simulation test against it.
# Nothing is committed - this only answers "would the next bump break us?" a week
# before somebody does it by hand. A failure pings Slack.
#
# This job pins by rev, because master has no tag. The bump that is actually
# committed happens elsewhere and pins by tag, because it follows releases:
# see bump-starknet-foundry-release.yml.
on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour to avoid the scheduler's peak.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of foundry-rs/starknet-foundry to bump to
        required: false
        default: master

concurrency:
  group: bump-starknet-foundry
  cancel-in-progress: false

permissions:
  contents: read

env:
  FOUNDRY_REPO: foundry-rs/starknet-foundry
  # Upstream's default branch is `master`, not `main`. The crates this workspace
  # uses - including the `starkloupe` feature on cheatnet, upstreamed in #4584 -
  # live here, and Cargo.toml pins this remote directly, so only the rev moves.
  FOUNDRY_REF: ${{ github.event.inputs.ref || 'master' }}
  # The .sqlx directory holds prepared queries so sqlx::query! macros compile
  # without a live database.
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: bump + compile + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Same system packages the Dockerfile installs to build the workspace.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      # Installed before the bump on purpose: the cache key is derived from
      # Cargo.lock, so keying off the committed lock file reuses the build of
      # everything the bump does not move.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Cargo.toml may be pinned either way - by tag from a release bump, or by
      # rev from a previous hand-rolled bump off master - so the current pin is
      # read rather than assumed, then resolved to a commit to compare against
      # the branch tip.
      - name: Read current pin
        id: pin
        run: ./scripts/foundry_pin.py read >> "$GITHUB_OUTPUT"

      - name: Resolve latest revision
        id: rev
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_KEY: ${{ steps.pin.outputs.pin_key }}
          PIN_VALUE: ${{ steps.pin.outputs.pin_value }}
        run: |
          set -euo pipefail
          # /commits/<ref> takes a tag or a sha, and resolves an annotated tag to
          # its commit, so both kinds of pin land on a comparable sha.
          current=$(gh api "repos/${FOUNDRY_REPO}/commits/${PIN_VALUE}" --jq .sha)
          latest=$(git ls-remote "https://github.com/${FOUNDRY_REPO}.git" "refs/heads/${FOUNDRY_REF}" | cut -f1)
          if [ -z "$latest" ]; then
            echo "::error::Branch ${FOUNDRY_REF} does not exist in ${FOUNDRY_REPO}"
            exit 1
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
            if [ "$current" = "$latest" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"
          {
            echo "### starknet-foundry bump"
            echo
            echo "| | pin | commit |"
            echo "| --- | --- | --- |"
            echo "| current | \`${PIN_KEY} = ${PIN_VALUE}\` | \`${current}\` |"
            echo "| ${FOUNDRY_REF} | \`rev = ${latest}\` | \`${latest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Already up to date
        if: steps.rev.outputs.changed == 'false'
        run: echo "Cargo.toml already pins the tip of ${FOUNDRY_REF}; nothing to test." >> "$GITHUB_STEP_SUMMARY"

      # Writes `rev = "<sha>"` over whichever form the manifest had. Discarded
      # with the runner - this job never commits.
      - name: Pin latest rev
        if: steps.rev.outputs.changed == 'true'
        env:
          LATEST_REV: ${{ steps.rev.outputs.latest }}
        run: |
          set -euo pipefail
          ./scripts/foundry_pin.py set rev "$LATEST_REV"
          git --no-pager diff -- Cargo.toml

      # Split out from the build so a resolution failure - upstream having moved
      # to a cairo-lang or blockifier version the workspace pins differently -
      # is reported as one, and not buried in a compile log.
      - name: Resolve dependencies
        if: steps.rev.outputs.changed == 'true'
        run: cargo fetch

      - name: Check
        if: steps.rev.outputs.changed == 'true'
        run: cargo check --workspace --all-targets

      # The e2e script does not install this itself - it only checks the binary
      # is present.
      - name: Install Universal Sierra Compiler
        if: steps.rev.outputs.changed == 'true'
        run: sh scripts/install-usc.sh

      - name: Build server
        if: steps.rev.outputs.changed == 'true'
        run: cargo build --bin server

      - name: Start Postgres and MinIO
        if: steps.rev.outputs.changed == 'true'
        run: |
          docker compose -f local/e2e-docker-compose.yaml up -d --wait postgres minio
          docker compose -f local/e2e-docker-compose.yaml run --rm createbuckets

      # The e2e test replays real mainnet transactions through the simulation
      # pipeline - fork state over RPC, blockifier/cheatnet execution, trace
      # collection and serialisation - which is the coverage that actually
      # catches a breaking foundry change.
      - name: Run e2e simulation test
        if: steps.rev.outputs.changed == 'true'
        env:
          E2E_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          E2E_ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
        run: ./scripts/e2e_test.py

      - name: Dump service logs on failure
        if: failure() && steps.rev.outputs.changed == 'true'
        run: docker compose -f local/e2e-docker-compose.yaml logs --tail=100

      - name: Notifying about check fail!
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_FOUNDRY_BUMP_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
